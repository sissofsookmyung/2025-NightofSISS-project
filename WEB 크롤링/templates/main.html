<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip.com 메인</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background-color: #74ebd5;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #67d6c4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trip.com</h1>
    <button onclick="location.href='/search/flight'">✈️ 항공권 검색</button>
    <button onclick="location.href='/search/hotel'">🏨 숙소 리뷰 검색</button>
  </div>
</body>
</html>
