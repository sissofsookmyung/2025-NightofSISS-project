<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>항공권 검색 결과</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height : 100vh;
            margin: 0;
            padding: 40px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 0px;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background-color: #f0f8ff;
            color: #2c3e50;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .price {
            color: #27ae60;
            font-weight: bold;
        }

        .rating {
            color: #f39c12;
            font-weight: bold;
        }

        .review {
            font-style: italic;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="section">
        <h2>✈️ 항공편 추천 ✈️</h2>
        <table>
            <thead>
                <tr>
                    <th>항공사</th>
                    <th>출발 시간</th>
                    <th>도착 시간</th>
                    <th>왕복 요금</th>
                </tr>
            </thead>
            <tbody>
                {% for flight in flights %}
                <tr>
                    <td>{{ flight.airline }}</td>
                    <td>{{ flight.departure }}</td>
                    <td>{{ flight.arrival }}</td>
                    <td class="price">{{ flight.price }}원</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>


</body>
</html>
