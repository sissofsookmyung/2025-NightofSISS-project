<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호텔 검색 결과</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 18px;
            font-size: 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f0f8ff;
            color: #34495e;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td.center {
            text-align: center;
            vertical-align: middle;
        }

        td.left {
            text-align: left;
            vertical-align: top;
        }

        .link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .review {
            color: #7f8c8d;
            font-style: italic;
            line-height: 1.6;
        }

        .review-list {
            margin: 0;
            padding-left: 20px;
        }

        .review-list li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h2>🏨 추천 호텔 목록 🏨</h2>
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">호텔 이름</th>
                <th style="width: 55%;">리뷰</th>
                <th style="width: 20%;">호텔 링크</th>
            </tr>
        </thead>
        <tbody>
            {% for hotel in hotels %}
            <tr>
                <td class="center">{{ hotel.name }}</td>
                <td class="left">
                    <ul class="review-list">
                        {% for review in hotel.reviews %}
                        <li class="review">{{ review }}</li>
                        {% endfor %}
                    </ul>
                </td>
                <td class="center link">
                    <a href="{{ hotel.link }}" target="_blank">페이지 열기</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
